[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncmu-backend"
version = "0.1.0"
description = "NCMU backend — FastAPI + 9 endpoints + JWT + chat_sessions double-write (Phase 1)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "NCMU Team" }]

dependencies = [
    "alembic>=1.13,<2",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.1,<3.3",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.35",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "pyjwt[crypto]>=2.9,<3",
    "httpx>=0.27,<0.29",
    # Phase 2C TASK-PC2-A (SCOPE-CHANGE approved by Boss 2026-05-21):
    # FastAPI's Form() / File() / UploadFile multipart handling requires
    # python-multipart at request time. Personal KB upload endpoint
    # (POST /v1/personal-kb/applications) is the first multipart consumer
    # in the backend. Pinned to the same lower bound FastAPI 0.115+ enforces.
    "python-multipart>=0.0.9,<1",
    # Phase 2E TASK-PE-11 (SCOPE-CHANGE approved by Boss 2026-05-30):
    # admin DSL import (POST /admin/apps/dsl-import) calls yaml.safe_load to
    # parse + validate uploaded App DSL before handing it to Dify. PE-11 is the
    # first first-party PyYAML consumer; it was only ambiently present in the
    # image, so declare it explicitly or a clean `pip install .` rebuild drops
    # it and `import yaml` breaks at runtime.
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-postgresql>=6,<8",
    "respx>=0.21,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
