[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncmu-backend"
version = "0.1.0"
description = "NCMU backend — FastAPI + 9 endpoints + JWT + chat_sessions double-write (Phase 1)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "NCMU Team" }]

dependencies = [
    "alembic>=1.13,<2",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.1,<3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-postgresql>=6,<8",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
