[alembic]
script_location = alembic

# D-1 修订：sqlalchemy.url 留空；alembic/env.py 从 NCMU_DB_URL 环境变量读取
# 以避免把密码硬编码到配置文件里。
sqlalchemy.url =

# Phase 1 迁移全部手写（0001/0002/0003），不使用 autogenerate。
# script.py.mako 仅在 `alembic revision` 时被读取，留默认模板即可。

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
