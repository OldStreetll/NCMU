# Shared proxy_set_header block included from each location that
# reverse-proxies into dify-nginx. Kept separate so dev.conf.template
# and prod.conf.template stay terse. Not run through envsubst (no
# ${VAR} expansions here), mounted directly into nginx.
proxy_set_header Host                $host;
proxy_set_header X-Real-IP           $remote_addr;
proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto   $scheme;
proxy_set_header X-Forwarded-Host    $host;

proxy_http_version 1.1;
proxy_set_header   Connection        "";

proxy_read_timeout    300s;
proxy_send_timeout    300s;
proxy_connect_timeout 10s;
proxy_buffering off;
